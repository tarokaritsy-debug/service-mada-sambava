<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Créer un compte - Service GSM Mada</title><style>body{font-family:Arial;background:#f3f5f7;margin:0}.box{max-width:420px;margin:50px auto;background:white;padding:24px;border-radius:16px;box-shadow:0 4px 20px #0001}input,button{width:100%;padding:13px;margin:8px 0;box-sizing:border-box;border-radius:10px;border:1px solid #ccc}button{background:#111;color:#fff;border:0;font-weight:bold}.msg{margin-top:10px}.link{text-align:center;margin-top:15px}</style><div class="box"><h1>Service GSM Mada</h1><h2>Créer un compte</h2><p>Inscris-toi avec ton numéro de téléphone.</p><input id="name" placeholder="Nom" required><input id="phone" placeholder="Numéro (ex. 0379121991)" inputmode="tel" required><input id="pass" type="password" placeholder="Mot de passe" required><button onclick="register()">Créer mon compte</button><div id="msg" class="msg"></div><div class="link">Déjà membre ? <a href="login.html">Se connecter</a></div></div><script>function register(){const name=document.getElementById('name').value.trim(),phone=document.getElementById('phone').value.trim(),pass=document.getElementById('pass').value;if(!name||!phone||!pass)return msg.textContent='Remplis tous les champs.';let users=JSON.parse(localStorage.getItem('gsm_users')||'[]');if(users.some(u=>u.phone===phone))return msg.textContent='Ce numéro possède déjà un compte.';users.push({name,phone,pass});localStorage.setItem('gsm_users',JSON.stringify(users));msg.textContent='Compte créé. Tu peux maintenant te connecter.';}</script></html>
