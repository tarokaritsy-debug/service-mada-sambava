<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connexion - Service GSM Mada</title><style>body{font-family:Arial;background:#f3f5f7;margin:0}.box{max-width:420px;margin:50px auto;background:white;padding:24px;border-radius:16px;box-shadow:0 4px 20px #0001}input,button{width:100%;padding:13px;margin:8px 0;box-sizing:border-box;border-radius:10px;border:1px solid #ccc}button{background:#111;color:#fff;border:0;font-weight:bold}.msg{margin-top:10px}.link{text-align:center;margin-top:15px}</style><div class="box"><h1>Service GSM Mada</h1><h2>Connexion membre</h2><input id="phone" placeholder="Numéro de téléphone" inputmode="tel"><input id="pass" type="password" placeholder="Mot de passe"><button onclick="login()">Se connecter</button><div id="msg" class="msg"></div><div class="link">Pas encore de compte ? <a href="register.html">Créer un compte</a></div></div><script>function login(){const phone=document.getElementById('phone').value.trim(),pass=document.getElementById('pass').value;const users=JSON.parse(localStorage.getItem('gsm_users')||'[]');const u=users.find(x=>x.phone===phone&&x.pass===pass);if(!u)return msg.textContent='Numéro ou mot de passe incorrect.';localStorage.setItem('gsm_current',JSON.stringify(u));location.href='member.html';}</script></html>
